name: Testler

# Her push ve PR'da node --test çalışır. Bağımlılık yok, kurulum yok — birkaç
# saniye sürer. Bölüm testi bir kez haftalarca kırık kaldı; bir daha kaçmasın.
# Vakit tazeleme iş akışının bot commit'leri bunu tetiklemez (GITHUB_TOKEN ile
# yapılan push yeni iş akışı başlatmaz), yalnızca vakitler/ değişirse de atlanır.
on:
  push:
    paths-ignore:
      - 'vakitler/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testleri çalıştır
        run: node --test araclar/*.test.cjs

      - name: index.html betiğinin sözdizimi
        # Uygulamanın tamamı index.html içindeki tek <script> bloğu; bir yazım
        # hatası açılışta bembeyaz ekran demek. Bloğu çıkarıp derletiyoruz.
        run: |
          node -e "
            const h = require('fs').readFileSync('index.html', 'utf8');
            const a = h.lastIndexOf('<script>'), b = h.lastIndexOf('</script>');
            if (a < 0 || b < a) { console.error('script bloğu bulunamadı'); process.exit(1); }
            require('fs').writeFileSync('/tmp/uygulama.js', h.slice(a + 8, b));
          "
          node --check /tmp/uygulama.js
          node --check bildirim.js
          node --check dualar.js
          node --check sw.js
